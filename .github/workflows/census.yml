name: census
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python crawler.py 480
      - run: |
          git config user.name census-bot
          git config user.email bot@users.noreply.github.com
          git add nodes.json
          git diff --cached --quiet || git commit -m "census snapshot"
          git push
