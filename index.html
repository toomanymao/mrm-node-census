<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Desert Front — BTC/USD</title>
<style>
  :root{
    --amber:#ffb84d; --amber-dim:#8f6a2e;
    --bull:#6fa8ff; --bear:#e0704f;
    --up:#3ddc84; --down:#ff5252;
    --panel:rgba(4,8,16,.72);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060c}
  body{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--amber);
       -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block}
  .hud{position:fixed;z-index:10;pointer-events:none}
  .panel{background:var(--panel);border:1px solid rgba(255,184,77,.28);backdrop-filter:blur(6px);
         padding:10px 12px;border-radius:2px}

  #feedmode{display:inline-block;margin-left:8px;font-size:9px;letter-spacing:.18em;
            padding:2px 6px;border:1px solid currentColor;border-radius:2px;color:var(--amber)}
  #feedmode.live{color:var(--up)}

  /* merged bottom gauge: portrait · bulls bar · PRICE · bears bar · portrait */
  #war{bottom:14px;left:50%;transform:translateX(-50%);width:min(680px,94vw);
       display:flex;align-items:center;gap:10px}
  .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  #sideL .lbl{text-align:left} #sideR .lbl{text-align:right}
  .lbl{font-size:10px;letter-spacing:.14em;white-space:nowrap}
  .lbl.b{color:var(--bull)} .lbl.r{color:var(--bear)}
  .halfbar{position:relative;height:8px;background:rgba(255,255,255,.07);
           border:1px solid rgba(255,184,77,.25)}
  .fillL{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--bull)}
  .fillR{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--bear)}
  #pxblock{flex:0 0 auto;text-align:center;padding:0 4px}
  #pxblock .px{font-size:22px;font-weight:700;color:#fff;line-height:1.1;font-variant-numeric:tabular-nums}
  #pxblock .dl{font-size:10px;font-variant-numeric:tabular-nums}
  #pxblock .dl.up{color:var(--up)} #pxblock .dl.down{color:var(--down)}
  #pxblock .sub{font-size:8px;letter-spacing:.16em;color:var(--amber-dim);margin-top:2px;white-space:nowrap}
  #feedmode{display:inline-block;margin-left:6px;font-size:8px;letter-spacing:.14em;
            padding:1px 5px;border:1px solid currentColor;border-radius:2px;color:var(--amber)}
  #feedmode.live{color:var(--up)}
  .portrait{width:46px;height:60px;object-fit:contain;flex:0 0 auto;display:none;
            background:rgba(255,255,255,.05);border:1px solid rgba(255,184,77,.3);border-radius:2px}


  /* compact top bar: title · version · info toggle */
  #topbar{top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
          pointer-events:auto;padding:7px 12px}
  #topbar .ttl{font-size:10px;letter-spacing:.22em;color:var(--amber);font-weight:700;white-space:nowrap}
  #topbar .ver{font-size:9px;letter-spacing:.14em;color:#fff;background:rgba(255,184,77,.18);
               border:1px solid rgba(255,184,77,.5);padding:2px 7px;border-radius:2px}
  #infoBtn{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,184,77,.55);
           background:transparent;color:var(--amber);font:inherit;font-size:11px;font-style:italic;
           font-weight:700;cursor:pointer;line-height:1;flex:0 0 auto}
  #infoBtn:hover{color:#fff;border-color:#fff}
  #infoPanel{top:54px;left:50%;transform:translateX(-50%);max-width:min(480px,92vw);
             font-size:10px;letter-spacing:.1em;line-height:1.9;color:var(--amber-dim);
             pointer-events:auto;padding:12px 16px;text-align:center}
  #infoPanel[hidden]{display:none}
  #infoPanel a{color:var(--amber);text-decoration:none;border-bottom:1px solid rgba(255,184,77,.4)}
  #infoPanel a:hover{color:#fff;border-color:#fff}
  #infoClose{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--amber-dim);
             font:inherit;font-size:12px;cursor:pointer}
  #infoClose:hover{color:#fff}
  #scan{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:.5;
        background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.12) 3px 4px)}
  #camBtn{position:fixed;bottom:14px;right:12px;z-index:11;pointer-events:auto;
          background:var(--panel);border:1px solid rgba(255,184,77,.35);color:var(--amber);
          font:inherit;font-size:9px;letter-spacing:.16em;padding:8px 11px;border-radius:2px;cursor:pointer}
  #camBtn.free{color:#fff;border-color:var(--amber)}
  #camBtn:active{transform:translateY(1px)}
  @media (max-width:900px){
    #topbar{top:0;left:0;right:0;transform:none;width:100%;justify-content:center;
            border-left:0;border-right:0;border-top:0;padding:5px 8px}
    #topbar .ttl{font-size:8px}
    #infoPanel{top:40px}
    #war{gap:6px} .portrait{width:36px;height:48px} #pxblock .px{font-size:17px} #pxblock .sub{display:none} .lbl{font-size:9px}
    
    #camBtn{bottom:88px;right:8px}
  }
  
</style>
</head>
<body>
<div id="scan"></div>

<div class="hud panel" id="topbar">
  <span class="ttl">BULLS vs BEARS</span>
  <span class="ver" id="ver">v13</span>
  <button id="infoBtn" title="Credits & info">i</button>
</div>

<div class="hud panel" id="infoPanel" hidden>
  <button id="infoClose">✕</button>
  inspired by <a href="https://bitcoinbattlefield.com" target="_blank" rel="noopener">Bitcoin Battlefield</a><br>
  3D models by <a href="https://kaylousberg.itch.io" target="_blank" rel="noopener">KayKit</a> (CC0)<br>
  price data: CoinGecko · BTC/USD
</div>

<div class="hud panel" id="war">
  <img id="pL" class="portrait" alt="">
  <div class="side" id="sideL">
    <div class="lbl b">■ BULLS <span id="kb">0</span></div>
    <div class="halfbar"><div id="barLfill" class="fillL"></div></div>
  </div>
  <div id="pxblock">
    <div class="px" id="px">—</div>
    <div class="dl" id="dl">BTC/USD</div>
    <div class="sub">BTC/USD · DESERT FRONT<span id="feedmode">SIM</span></div>
  </div>
  <div class="side" id="sideR">
    <div class="lbl r"><span id="kr">0</span> BEARS ■</div>
    <div class="halfbar"><div id="barRfill" class="fillR"></div></div>
  </div>
  <img id="pR" class="portrait" alt="">
</div>
<button id="camBtn">CAM · AUTO</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   LUNAR FRONT — a near-future infantry engagement on the Moon,
   driven by BTCUSDT. Price above the session anchor: the Bull
   Battalion advances east. Below: Bear Company pushes them back.
   No controls — the camera directs itself like a broadcast feed.
   ============================================================ */

const $ = id => document.getElementById(id);
const APP_VERSION='v13';
$('ver').textContent=APP_VERSION;
console.log('Desert Front '+APP_VERSION);
$('infoBtn').onclick=()=>{ const p=$('infoPanel'); p.hidden=!p.hidden; };
$('infoClose').onclick=()=>{ $('infoPanel').hidden=true; };
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let gaussSpare=null;
function gauss(){ if(gaussSpare!==null){const v=gaussSpare;gaussSpare=null;return v;}
  let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
  const m=Math.sqrt(-2*Math.log(u)); gaussSpare=m*Math.sin(2*Math.PI*v); return m*Math.cos(2*Math.PI*v); }

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b1c33);
scene.fog = new THREE.FogExp2(0xc9955e, 0.0022);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 2000);
camera.position.set(0,40,120);

scene.add(new THREE.AmbientLight(0x9a8068, .9));
scene.add(new THREE.HemisphereLight(0xffbf80, 0x6b4a2e, .6));
const sunLight = new THREE.DirectionalLight(0xffdfae, 1.6);
sunLight.position.set(-160,70,50); scene.add(sunLight);

/* ---------------- terrain ---------------- */
const FIELD_X = 100;
(function buildGround(){
  const g = new THREE.PlaneGeometry(460, 300, 96, 62);
  g.rotateX(-Math.PI/2);
  const pos = g.attributes.position;
  const craters=[]; for(let i=0;i<10;i++)
    craters.push({x:rand(-200,200), z:rand(-130,130), r:rand(8,18), d:rand(1,2.5)});
  const cols=[];
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    // rolling dunes
    let y = Math.sin(x*.03+z*.012)*2.6 + Math.sin(x*.09-z*.05)*1.1 + Math.sin(z*.07)*1.4;
    for(const c of craters){
      const d=Math.hypot(x-c.x,z-c.z);
      if(d<c.r){ const t=d/c.r; y += -c.d*Math.cos(t*Math.PI/2) + c.d*.3*Math.exp(-((t-1)*(t-1))*24); }
    }
    const lane = clamp(1-Math.abs(z)/70,0,1)*clamp(1-Math.abs(x)/130,0,1);
    y *= (1-lane*.75);
    pos.setY(i,y);
    const sh = .8 + y*.045 + rand(-.04,.04);   // warm sand
    cols.push(.80*sh, .62*sh, .40*sh);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({vertexColors:true})));

  const rockMat=new THREE.MeshLambertMaterial({color:0x8a5a3c});
  for(let i=0;i<40;i++){
    const x=rand(-210,210), z=rand(-140,140);
    if(Math.abs(x)<115 && Math.abs(z)<62) continue;
    const r=new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.8,3.6),0),rockMat);
    r.position.set(x,rand(0,.6),z);
    r.rotation.set(rand(0,3),rand(0,3),rand(0,3));
    scene.add(r);
  }
  // distant red-rock mesas on the horizon
  const mesaMat=new THREE.MeshLambertMaterial({color:0x7a4632});
  const mesas=[[-260,-190,70,34],[240,-210,90,46],[320,60,60,30],[-300,110,80,26],[60,-250,110,40]];
  for(const [mx,mz,mw,mh] of mesas){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(mw*.7,mw,mh,9),mesaMat);
    m.position.set(mx,mh/2-4,mz); m.rotation.y=rand(0,3);
    scene.add(m);
  }
})();

/* wrecked hardware & cover on the field */
(function buildProps(){
  const hull=new THREE.MeshLambertMaterial({color:0x9a7a58});
  const dark=new THREE.MeshLambertMaterial({color:0x6b4e36});
  // downed dropship near the middle — the thing both sides are fighting over
  const ship=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.8,26,10),hull);
  body.rotation.z=Math.PI/2; ship.add(body);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(6,5,.7),dark); tail.position.set(-13,2.5,0); ship.add(tail);
  const wingL=new THREE.Mesh(new THREE.BoxGeometry(9,.5,7),dark); wingL.position.set(2,1.5,-6); wingL.rotation.x=.5; ship.add(wingL);
  const wingR=new THREE.Mesh(new THREE.BoxGeometry(9,.5,7),dark); wingR.position.set(4,.8,6.5); ship.add(wingR);
  ship.position.set(6,1.4,-26); ship.rotation.set(.12,.7,.1);
  scene.add(ship);
  // habitat modules to the north
  for(let i=0;i<3;i++){
    const h=new THREE.Mesh(new THREE.CylinderGeometry(4,4,14,12),new THREE.MeshLambertMaterial({color:0xb99a6e}));
    h.rotation.z=Math.PI/2; h.position.set(-30+i*26, 3.6, 52+rand(-3,3)); h.rotation.y=rand(-.2,.2);
    scene.add(h);
    const win=new THREE.Mesh(new THREE.BoxGeometry(10,.9,.3),new THREE.MeshBasicMaterial({color:0xcfe7ff}));
    win.position.copy(h.position); win.position.z-=4.05; win.position.y+=1.4; scene.add(win);
  }
  // scattered supply crates & barriers
  const crate=new THREE.MeshLambertMaterial({color:0x8f6f4c});
  for(let i=0;i<14;i++){
    const c=new THREE.Mesh(new THREE.BoxGeometry(rand(1.6,3),rand(1.2,2),rand(1.6,3)),crate);
    c.position.set(rand(-85,85),.8,rand(-46,46)); c.rotation.y=rand(0,3.14);
    scene.add(c);
  }
  // defensive berms at each side's line of departure
  const bermB=new THREE.MeshLambertMaterial({color:0xb08a5c});
  for(let i=0;i<6;i++){
    for(const s of [-1,1]){
      const b=new THREE.Mesh(new THREE.BoxGeometry(2,1.8,7),bermB);
      b.position.set(s*FIELD_X+rand(-4,4), .8, (i-2.5)*9);
      b.rotation.y=rand(-.25,.25); b.rotation.z=rand(-.06,.06);
      scene.add(b);
    }
  }
})();

/* ---------------- sky: dusk gradient, low sun, faint stars, twin moons -- */
(function buildSky(){
  // gradient dome: orange horizon fading to violet-night zenith
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const x=c.getContext('2d');
  const grd=x.createLinearGradient(0,256,0,0);
  grd.addColorStop(0,'#e0904a'); grd.addColorStop(.25,'#c96f45');
  grd.addColorStop(.55,'#5c3556'); grd.addColorStop(1,'#221a38');
  x.fillStyle=grd; x.fillRect(0,0,4,256);
  const domeTex=new THREE.CanvasTexture(c);
  const dome=new THREE.Mesh(new THREE.SphereGeometry(820,24,18),
    new THREE.MeshBasicMaterial({map:domeTex,side:THREE.BackSide,fog:false}));
  scene.add(dome);

  // faint high stars
  const sg=new THREE.BufferGeometry(); const sp=[];
  for(let i=0;i<1000;i++){
    const t=Math.acos(rand(-1,-.15)), p=rand(0,Math.PI*2), r=760;
    sp.push(r*Math.sin(t)*Math.cos(p), Math.abs(r*Math.cos(t))+90, r*Math.sin(t)*Math.sin(p));
  }
  sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffeeda,size:1.5,
    sizeAttenuation:false,transparent:true,opacity:.7,fog:false})));

  // the low sun
  const sc=document.createElement('canvas'); sc.width=sc.height=128;
  const sx=sc.getContext('2d'); const sgr=sx.createRadialGradient(64,64,10,64,64,64);
  sgr.addColorStop(0,'rgba(255,240,200,1)'); sgr.addColorStop(.3,'rgba(255,190,110,.85)');
  sgr.addColorStop(1,'rgba(255,150,60,0)');
  sx.fillStyle=sgr; sx.fillRect(0,0,128,128);
  const sun=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sc),
    blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:false}));
  sun.position.set(-560,95,180); sun.scale.set(260,260,1); scene.add(sun);

  // twin moons hanging in the dusk
  const moonMat=new THREE.MeshBasicMaterial({color:0xe8d9c8,fog:false});
  const m1=new THREE.Mesh(new THREE.CircleGeometry(16,32),moonMat); m1.position.set(240,180,-560);
  const m2=new THREE.Mesh(new THREE.CircleGeometry(8,32),moonMat.clone()); m2.material.color.set(0xcbb8a8);
  m2.position.set(330,140,-540);
  m1.onBeforeRender=()=>m1.lookAt(camera.position);
  m2.onBeforeRender=()=>m2.lookAt(camera.position);
  scene.add(m1); scene.add(m2);
})();

/* a giant Bitcoin planet dominates the sky; its halo carries the market mood */
let planetGlow;
(function buildPlanet(){
  const pc=document.createElement('canvas'); pc.width=pc.height=256;
  const px=pc.getContext('2d');
  const pg=px.createRadialGradient(100,90,30,128,128,128);
  pg.addColorStop(0,'#ffc46a'); pg.addColorStop(.6,'#f7931a'); pg.addColorStop(1,'#9a5407');
  px.fillStyle=pg; px.beginPath(); px.arc(128,128,124,0,7); px.fill();
  px.globalAlpha=.18; px.fillStyle='#7a4000';
  for(let i=0;i<7;i++){ px.fillRect(0,30+i*32+Math.sin(i)*6,256,rand(6,14)); }
  px.globalAlpha=1;
  // the ₿ mark, tilted like the Bitcoin logo
  px.save(); px.translate(128,128); px.rotate(-0.24);
  px.fillStyle='#fff'; px.font='bold 170px Arial';
  px.textAlign='center'; px.textBaseline='middle';
  px.fillText('₿',0,10); px.restore();
  const grp=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CircleGeometry(52,48),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(pc),fog:false}));
  grp.add(body);
  const ring=new THREE.Mesh(new THREE.RingGeometry(64,96,64),
    new THREE.MeshBasicMaterial({color:0xd9c39a,transparent:true,opacity:.55,
      side:THREE.DoubleSide,fog:false}));
  ring.rotation.x=1.25; ring.rotation.y=.25; grp.add(ring);
  const hc=document.createElement('canvas'); hc.width=hc.height=128;
  const hx=hc.getContext('2d'); const hg=hx.createRadialGradient(64,64,26,64,64,64);
  hg.addColorStop(0,'rgba(247,180,120,.4)'); hg.addColorStop(1,'rgba(247,180,120,0)');
  hx.fillStyle=hg; hx.fillRect(0,0,128,128);
  planetGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(hc),
    blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:false}));
  planetGlow.scale.set(340,340,1); grp.add(planetGlow);
  grp.position.set(-140,240,-640);
  const face=()=>grp.lookAt(camera.position);
  body.onBeforeRender=face;
  scene.add(grp);
})();

/* ---------------- soldier geometry (merged boxes, 1 draw call/unit) ---- */
function mergeBoxes(parts){
  const positions=[], normals=[], colors=[];
  const col=new THREE.Color();
  for(const p of parts){
    let bg=new THREE.BoxGeometry(p.w,p.h,p.d).toNonIndexed();
    if(p.ry) bg.rotateY(p.ry);
    if(p.rz) bg.rotateZ(p.rz);
    bg.translate(p.x||0,p.y||0,p.z||0);
    const pa=bg.attributes.position.array, na=bg.attributes.normal.array;
    col.setHex(p.c);
    for(let i=0;i<pa.length;i+=3){
      positions.push(pa[i],pa[i+1],pa[i+2]);
      normals.push(na[i],na[i+1],na[i+2]);
      colors.push(col.r,col.g,col.b);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
  return g;
}
const unitMat=new THREE.MeshLambertMaterial({vertexColors:true});
const RIFLE=0x1e2126, VISOR=0xbfe4ff, PACK=0x2c2f35;
// EVA combat suits — realistic silhouette: helmet, chest rig, life-support pack, rifle
function suitGeo(main,dark,accent){
  return mergeBoxes([
    {w:.42,h:1.1,d:.42,x:0,y:.55,z:-.24,c:dark},{w:.42,h:1.1,d:.42,x:0,y:.55,z:.24,c:dark},   // legs
    {w:.3,h:.2,d:.5,x:.08,y:.1,z:-.24,c:dark},{w:.3,h:.2,d:.5,x:.08,y:.1,z:.24,c:dark},       // boots
    {w:.68,h:1.05,d:.95,x:0,y:1.62,z:0,c:main},                                                // torso
    {w:.72,h:.5,d:.99,x:.02,y:1.78,z:0,c:dark},                                                // chest rig
    {w:.14,h:.18,d:.3,x:.38,y:1.55,z:-.22,c:accent},                                           // unit patch
    {w:.34,h:.85,d:.34,x:-.02,y:1.6,z:-.62,rz:.12,c:main},                                     // arm L
    {w:.34,h:.85,d:.34,x:.18,y:1.55,z:.6,rz:-.4,c:main},                                       // arm R (aiming)
    {w:.52,h:.56,d:.52,x:.03,y:2.42,z:0,c:main},                                               // helmet
    {w:.1,h:.24,d:.4,x:.31,y:2.44,z:0,c:VISOR},                                                // visor
    {w:.44,h:.8,d:.62,x:-.5,y:1.75,z:0,c:PACK},                                                // life-support pack
    {w:.09,h:.5,d:.09,x:-.5,y:2.45,z:.2,c:dark},                                               // antenna
    {w:1.25,h:.2,d:.16,x:.62,y:1.5,z:.42,c:RIFLE},{w:.22,h:.4,d:.16,x:.42,y:1.28,z:.42,c:RIFLE},// rifle
  ]);
}
const bullGeo = suitGeo(0x5a646f, 0x3c434c, 0x6fa8ff);  // slate-grey suits, blue patch
const bearGeo = suitGeo(0x6d6455, 0x453f34, 0xe0704f);  // sand-brown suits, red patch

/* ---------------- forces ---------------- */
const BULL_NAMES=['Sgt. Reyes','Cpl. Chen','Pvt. Okafor','Lt. Hansen','Cpl. Marsh','Pvt. Iyer',
 'Sgt. Duval','Pvt. Kowalski','Cpl. Tanaka','Pvt. Silva','Sgt. Brandt','Pvt. Nunez',
 'Cpl. Ferro','Pvt. Lindqvist','Sgt. Adeyemi','Pvt. Cho'];
const BEAR_NAMES=['Sgt. Kade','Cpl. Ruiz','Pvt. Malik','Lt. Sorren','Cpl. Vane','Pvt. Ashford',
 'Sgt. Petric','Pvt. Doyle','Cpl. Aslan','Pvt. Marek','Sgt. Iversen','Pvt. Gallo',
 'Cpl. Sato','Pvt. Renner','Sgt. Obi','Pvt. Kraus'];
const VERBS=['took down','eliminated','dropped','neutralized','hit','picked off','caught'];
const MEANS=['· rifle fire','· marksman','· crossfire','· suppressing fire','· grenade','· close range'];

const PER_SIDE=40, ROWS=8;
const units=[];
function makeSide(side){ // +1 bulls (west, face +x) | -1 bears (east, face -x)
  const geo = side>0?bullGeo:bearGeo;
  const names = side>0?BULL_NAMES:BEAR_NAMES;
  for(let i=0;i<PER_SIDE;i++){
    const root=new THREE.Group();
    const box=new THREE.Mesh(geo,unitMat);
    root.add(box);
    const row=i%ROWS, rank=(i/ROWS)|0;
    const u={root,visual:box,mixer:null,actions:null,current:null,
      side,rank,alive:true,deadAt:0,respawnAt:0,
      z:(row-(ROWS-1)/2)*6+rand(-1.8,1.8),
      depth:6+rank*5.5+rand(-1.5,1.5),
      seed:rand(0,100),
      crouchT:rand(0,10),
      speed:rand(.85,1.2)*6.5,
      name:names[i%names.length]};
    root.position.set(side>0?-40-u.depth:40+u.depth, 0, u.z);
    root.rotation.y = side>0?0:Math.PI;
    scene.add(root); units.push(u);
  }
}
makeSide(1); makeSide(-1);
const bulls=units.filter(u=>u.side>0), bears=units.filter(u=>u.side<0);

/* ---------------- optional GLB characters (drop-in) ----------------
   Put two rigged/animated models next to this file:
     assets/bull.glb   (west force)
     assets/bear.glb   (east force)
   e.g. KayKit's Space Ranger + Orc Raider (CC0). If the files or the
   loader aren't reachable, the built-in box soldiers are used instead. */
const MODEL_YAW = Math.PI/2;  // rotate so characters face +X; if yours run sideways, try 0, Math.PI or -Math.PI/2
function setAnim(u,name){
  if(!u.actions) return;
  const next=u.actions[name]||u.actions.idle;
  if(!next||u.current===next) return;
  next.reset().fadeIn(.18).play();
  if(u.current) u.current.fadeOut(.18);
  u.current=next;
}
function deployModel(gltf,arr,tint,weapon){
  const src=gltf.scene;
  if(tint){ // multiply the texture with a faction colour (e.g. orc green)
    const seen=new Set();
    src.traverse(o=>{
      if(o.isMesh&&o.material){
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const mt of mats){ if(!seen.has(mt)){ seen.add(mt); if(mt.color) mt.color.multiply(tint); } }
      }
    });
  }
  const bb=new THREE.Box3().setFromObject(src);
  const h=Math.max(bb.max.y-bb.min.y,.001);
  const s=2.9/h;                                  // normalise to soldier height
  const clips=gltf.animations||[];
  const get=(exact,re)=>clips.find(c=>c.name===exact)||clips.find(c=>re.test(c.name));
  const cIdle =get('Idle',/idle|stand|breath/i)||clips[0];
  const cRun  =get('Run_Gun',/run|sprint|jog/i)||get('Walking_A',/walk|march/i)||cIdle;
  const cFire =get('2H_Ranged_Shooting',/shoot|firing|fire_|aim|attack|punch/i); // hold the line: aim / swing
  const cDeath=get('Death_A',/death|die|dead|fall/i);
  for(const u of arr){
    const inst=THREE.SkeletonUtils.clone(src);
    if(weapon){
      const w=weapon.clone(true);
      let slot=null;
      inst.traverse(o=>{ if(!slot && /handslot\.r/i.test(o.name||'')) slot=o; });
      if(!slot) inst.traverse(o=>{ if(!slot && /hand\.r$/i.test(o.name||'')) slot=o; });
      if(slot) slot.add(w);
    }
    inst.scale.setScalar(s);
    inst.position.y=-bb.min.y*s;
    inst.rotation.y=MODEL_YAW;
    const wrap=new THREE.Group(); wrap.add(inst);
    u.root.remove(u.visual);
    u.visual=wrap; u.root.add(wrap);
    if(clips.length){
      u.mixer=new THREE.AnimationMixer(inst);
      u.actions={};
      if(cIdle) u.actions.idle=u.mixer.clipAction(cIdle);
      if(cRun)  u.actions.run =u.mixer.clipAction(cRun);
      if(cFire) u.actions.fire=u.mixer.clipAction(cFire);
      if(cDeath){ const a=u.mixer.clipAction(cDeath);
        a.setLoop(THREE.LoopOnce); a.clampWhenFinished=true; u.actions.death=a; }
      u.mixer.update(rand(0,1));                  // desync the crowd
      setAnim(u,'idle');
    }
  }
}
/* portraits: render each side's character once into the gauge thumbnails */
function makePortrait(build,imgEl,faceY){
  try{
    const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
    r.setPixelRatio(2); r.setSize(92,120);
    const sc=new THREE.Scene();
    sc.add(new THREE.AmbientLight(0xffffff,.95));
    const dl=new THREE.DirectionalLight(0xfff1d6,.9); dl.position.set(2,4,3); sc.add(dl);
    const inst=build(); inst.rotation.y=faceY; sc.add(inst);
    const bb=new THREE.Box3().setFromObject(inst);
    const size=bb.getSize(new THREE.Vector3()), c=bb.getCenter(new THREE.Vector3());
    const cam=new THREE.PerspectiveCamera(32,92/120,.01,100);
    const dist=Math.max(size.y,size.x*1.4)*2.0;
    cam.position.set(c.x,c.y+size.y*.12,c.z+dist);
    cam.lookAt(c);
    r.render(sc,cam);
    imgEl.src=r.domElement.toDataURL('image/png');
    imgEl.style.display='block';
    r.dispose(); if(r.forceContextLoss) r.forceContextLoss();
  }catch(e){ console.log('portrait failed:',e); }
}
function portraitFromGltf(gltf,imgEl,faceY,weapon){
  makePortrait(()=>{
    const inst=THREE.SkeletonUtils.clone(gltf.scene);
    if(weapon){
      const w=weapon.clone(true); let slot=null;
      inst.traverse(o=>{ if(!slot && /handslot\.r/i.test(o.name||'')) slot=o; });
      if(slot) slot.add(w);
    }
    const clips=gltf.animations||[];
    const idle=clips.find(c=>c.name==='Idle')||clips[0];
    if(idle){ const mx=new THREE.AnimationMixer(inst); mx.clipAction(idle).play(); mx.update(.5); }
    return inst;
  },imgEl,faceY);
}

function loadScript(src){ return new Promise((res,rej)=>{
  const s=document.createElement('script'); s.src=src;
  s.onload=res; s.onerror=()=>rej(new Error('script blocked: '+src));
  document.head.appendChild(s); }); }
(async function loadModels(){
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js');
    await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js');
    const loader=new THREE.GLTFLoader();
    const load=u=>new Promise((res,rej)=>loader.load(u,res,undefined,()=>rej(new Error('not found: '+u))));
    const [gB,gR]=await Promise.all([load('assets/bull.glb'),load('assets/bear.glb')]);
    const parseGlb=b64=>new Promise((res,rej)=>{
      const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)).buffer;
      loader.parse(bin,'',g=>res(g.scene),rej);
    });
    let wB=null,wR=null;
    try{ [wB,wR]=await Promise.all([parseGlb(CROSSBOW_2H_B64),parseGlb(CROSSBOW_1H_B64)]); }
    catch(e){ console.log('weapons failed to parse:',e); }
    deployModel(gB,bulls,null,wB);         // knight + heavy crossbow
    deployModel(gR,bears,null,wR);         // barbarian + hand crossbow
    portraitFromGltf(gB,$('pL'),.45,wB);
    portraitFromGltf(gR,$('pR'),-.45,wR);
    try{ // optional second marine variant for a mixed squad
      const g2=await load('assets/bull2.glb');
      deployModel(g2,bulls.filter((u,i)=>i%2===1),null);
    }catch(e){}
    console.log('Desert Front: GLB characters deployed');
  }catch(e){
    console.log('Desert Front: built-in soldiers active — '+(e&&e.message?e.message:e));
    makePortrait(()=>new THREE.Mesh(bullGeo,unitMat),$('pL'),-Math.PI/2+.4);
    makePortrait(()=>new THREE.Mesh(bearGeo,unitMat),$('pR'),-Math.PI/2-.4);
  }
})();

function buildBullMech(){
  const g=mergeBoxes([
    {w:1.2,h:3.2,d:1.2,x:-1.2,y:1.6,z:-1.5,c:0x33415e},{w:1.2,h:3.2,d:1.2,x:-1.2,y:1.6,z:1.5,c:0x33415e},
    {w:1.2,h:3.2,d:1.2,x:1.4,y:1.6,z:-1.5,c:0x33415e},{w:1.2,h:3.2,d:1.2,x:1.4,y:1.6,z:1.5,c:0x33415e},
    {w:6.2,h:2.6,d:4.6,x:0,y:4.4,z:0,c:0x46598a},
    {w:.5,h:.6,d:4.8,x:2.9,y:4.6,z:0,c:0xd8a531},
    {w:2.4,h:1.6,d:2.4,x:-.4,y:6.4,z:0,c:0x3a4a75},
    {w:4.4,h:.55,d:.55,x:3.6,y:6.3,z:0,c:0x22252b},   // cannon
    {w:.7,h:.9,d:.9,x:1.6,y:6.3,z:0,c:0xd8a531},
    {w:.08,h:2.2,d:.08,x:-2.4,y:8,z:.8,c:0x8892b0},
  ]);
  const m=new THREE.Mesh(g,unitMat);
  const grp=new THREE.Group(); grp.add(m);
  grp.visible=false; scene.add(grp);
  return grp;
}
function buildBearRam(){
  const g=mergeBoxes([
    {w:7,h:2.4,d:4.2,x:0,y:2.6,z:0,c:0x5c4327},
    {w:1.4,h:1.4,d:4.6,x:-3.6,y:2.6,z:0,c:0x4a3620},
    {w:3.4,h:1.1,d:1.1,x:-4.6,y:2.4,z:0,c:0x6e6e76},  // ram head
    {w:.5,h:1.6,d:.5,x:-1,y:4.6,z:-1.4,c:0x6e6e76},{w:.5,h:1.6,d:.5,x:1,y:4.6,z:1.2,c:0x6e6e76},
    {w:.5,h:1.3,d:.5,x:2.2,y:4.4,z:-1,c:0x6e6e76},    // spikes
    {w:2.2,h:2,d:3,x:2.2,y:4.2,z:0,c:0x4a3620},
  ]);
  const m=new THREE.Mesh(g,unitMat);
  const grp=new THREE.Group(); grp.add(m);
  const wheelG=new THREE.CylinderGeometry(1.15,1.15,.6,10);
  const wheelM=new THREE.MeshLambertMaterial({color:0x2e2318});
  for(const [wx,wz] of [[-2.4,-2.2],[-2.4,2.2],[2.4,-2.2],[2.4,2.2]]){
    const w=new THREE.Mesh(wheelG,wheelM);
    w.rotation.x=Math.PI/2; w.position.set(wx,1.15,wz);

  return grp;
}
const machines={
  b:{grp:buildBullMech(), side: 1, homeX:-150, z:-13, active:false, shot:0},
  r:{grp:buildBearRam(),  side:-1, homeX: 150, z: 13, active:false, shot:0}
};
machines.b.grp.position.set(machines.b.homeX,0,machines.b.z);
machines.r.grp.position.set(machines.r.homeX,0,machines.r.z);
machines.r.grp.rotation.y=Math.PI;
function updateMachines(dt,fx,mom,T){
  for(const k of ['b','r']){
    const M=machines[k], favored=(k==='b'? mom : -mom);
    if(!M.active && favored>.5){ M.active=true; M.grp.visible=true;
      M.grp.position.x=M.homeX; }
    if(!M.active) continue;
    const retreat=favored<.28;
    const tx=retreat? M.homeX : fx - M.side*20;
    const dx=tx-M.grp.position.x;
    M.grp.position.x+=clamp(dx,-14*dt,14*dt);
    M.grp.position.y=Math.abs(Math.sin(T*3.2))*.35;           // stomp / rumble
    M.grp.rotation.z=Math.sin(T*3.2)*.02*M.side;
    if(retreat && Math.abs(dx)<2){ M.active=false; M.grp.visible=false; continue; }
    M.shot-=dt;
    if(!retreat && M.shot<=0 && Math.abs(M.grp.position.x-fx)<70){
      M.shot=rand(1.6,2.6);
      const from=M.grp.position.clone(); from.y+=6.2; from.x+=M.side*3.5;
      const to=new THREE.Vector3(fx+M.side*12+rand(-4,4),1.6,rand(-22,22));
      fireTracer(from,to,3);
      setTimeout(()=>{ clash(to); impact(to);
        const foes=(M.side>0?bears:bulls).filter(u=>u.alive&&Math.abs(u.root.position.z-to.z)<5&&Math.abs(u.root.position.x-to.x)<6);
        if(foes.length){ const v=foes[0];
          v.alive=false; v.deadAt=clock.getElapsedTime(); v.respawnAt=v.deadAt+rand(3,5.5);
          if(v.actions&&v.actions.death){ if(v.current)v.current.fadeOut(.1);
            v.current=v.actions.death; v.actions.death.reset().fadeIn(.1).play(); }
          if(M.side>0) killsB++; else killsR++;
          $('kb').textContent=killsB; $('kr').textContent=killsR;
        }
      },140);
    }
  }
}

const laserGeo=new THREE.BoxGeometry(.12,.12,1); laserGeo.translate(0,0,.5);
const tracerMat=new THREE.MeshBasicMaterial({color:0xffe9b0,blending:THREE.AdditiveBlending,transparent:true});
const lasers=[];
function fireTracer(from,to,w){
  const m=new THREE.Mesh(laserGeo,tracerMat.clone());
  m.position.copy(from); m.lookAt(to);
  m.scale.set(w||1,w||1,from.distanceTo(to));
  scene.add(m); lasers.push({m,life:.11});
}
const bursts=[];
function clash(p){ // sparks at the point of impact
  const N=16, g=new THREE.BufferGeometry();
  const pos=new Float32Array(N*3), vel=[];
  for(let i=0;i<N;i++){ pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;
    vel.push(new THREE.Vector3(gauss(),Math.abs(gauss())*.8,gauss()).multiplyScalar(rand(5,13))); }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0xfff3c4,size:.32,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const pts=new THREE.Points(g,mat); scene.add(pts);
  bursts.push({pts,vel,life:.3,max:.3});
}
function impact(p){ // regolith kicked up — grey dust, no fireball (vacuum)
  const N=30, g=new THREE.BufferGeometry();
  const pos=new Float32Array(N*3), vel=[];
  for(let i=0;i<N;i++){ pos[i*3]=p.x;pos[i*3+1]=Math.max(.2,p.y-1);pos[i*3+2]=p.z;
    vel.push(new THREE.Vector3(gauss()*.7,Math.abs(gauss())*1.6,gauss()*.7).multiplyScalar(rand(3,9))); }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0xd6b285,size:.5,transparent:true,depthWrite:false});
  const pts=new THREE.Points(g,mat); scene.add(pts);
  bursts.push({pts,vel,life:.9,max:.9});
}

  const srcs=[[6,-26],[  -44,30],[52,-38]];
  for(const [sx,sz] of srcs) for(let i=0;i<5;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,opacity:.35}));
    s.position.set(sx+rand(-2,2), rand(2,16), sz+rand(-2,2));
    s.scale.setScalar(rand(4,9));
    smokes.push({s,sx,sz,v:rand(1.2,2.4)});
    scene.add(s);
  }
})();

/* ---------------- price engine ---------------- */
const price={ p:64500, target:64500, anchor:64500, emaF:64500, emaS:64500, live:false, ws:null, poll:0 };
let trend=0;
function simStep(dt){
  trend += (-trend*.15 + gauss()*.9)*dt;
  const vol=.0024;
  price.target *= Math.exp(vol*Math.sqrt(dt)*gauss() + trend*.00035*dt);
  if(Math.random()<dt*.1) price.target*=Math.exp(rand(-.004,.004));
}
function priceStep(dt){
  if(!price.live) simStep(dt);
  price.p += (price.target-price.p)*Math.min(1,dt*6);
  const aF=1-Math.exp(-dt/4), aS=1-Math.exp(-dt/45), aA=1-Math.exp(-dt/240);
  price.emaF+= (price.p-price.emaF)*aF;
  price.emaS+= (price.p-price.emaS)*aS;
  price.anchor+=(price.p-price.anchor)*aA;
}
const frontline = ()=> Math.tanh((price.p/price.anchor-1)*(price.live?800:420))*FIELD_X*.72;
const momentum  = ()=> clamp((price.emaF/price.emaS-1)*(price.live?2600:1200),-1,1);

function setFeedBadge(){
  const b=$('feedmode');
  b.textContent = price.live?'LIVE':'SIM';
  b.className = price.live?'live':'';
}
/* connect automatically; the primary source is CoinGecko's BTC/USD price —
   the same feed the mrmpodcast.com terminal uses, so the number in this
   battle always matches the number on the widget. Falls back to Binance's
   BTCUSDT stream if CoinGecko is unreachable, then to simulation. */
(function autoLive(){
  const seed=v=>{ price.p=price.target=price.emaF=price.emaS=price.anchor=v; };
  let ok=false, failed=0;
  const tick=()=>fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd')
    .then(r=>r.json()).then(j=>{
      const v=j.bitcoin.usd; failed=0;
      if(!ok){ ok=true; price.live=true; seed(v); setFeedBadge(); }
      price.target=v;
    }).catch(()=>{
      failed++;
      if(!ok || failed>4){
        clearInterval(price.poll);
        if(ok){ price.live=false; setFeedBadge(); }
        binanceFallback();
      }
    });
  tick(); price.poll=setInterval(tick,10000);
  function binanceFallback(){
    let opened=false;
    try{
      const ws=new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
      price.ws=ws;
      ws.onmessage=ev=>{
        const v=parseFloat(JSON.parse(ev.data).p);
        if(!opened){ opened=true; price.live=true; seed(v); setFeedBadge(); }
        price.target=v;
      };
      ws.onclose=()=>{ if(opened){ price.live=false; setFeedBadge(); } };
      setTimeout(()=>{ if(!opened){ try{ws.close();}catch(e){} } },4000);  // stay in sim, no fuss
    }catch(e){}
  }
})();

/* ---------------- combat ---------------- */
let killsB=0,killsR=0,killTimer=0;
function addFeed(){ /* killfeed panel removed — kills tracked in the gauge counters */ }
function tryKill(mom){
  const bias=.5+mom*.42;
  const bullScores=Math.random()<bias;
  const shooters=(bullScores?bulls:bears).filter(u=>u.alive);
  const targets =(bullScores?bears:bulls).filter(u=>u.alive);
  if(!shooters.length||!targets.length) return;
  targets.sort((a,b)=>a.depth-b.depth);
  const victim=targets[(Math.random()*Math.min(6,targets.length))|0];
  const shooter=pick(shooters);
  const from=shooter.root.position.clone(); from.y+=1.6;
  const to=victim.root.position.clone(); to.y+=1.5;
  fireTracer(from,to,1);
  setTimeout(()=>{
    if(!victim.alive) return;
    clash(to);
    victim.alive=false; victim.deadAt=clock.getElapsedTime();
    victim.respawnAt=victim.deadAt+rand(3,5.5);
    if(victim.actions&&victim.actions.death){
      if(victim.current) victim.current.fadeOut(.1);
      victim.current=victim.actions.death;
      victim.actions.death.reset().fadeIn(.1).play();
    }
    impact(to);
    if(bullScores) killsB++; else killsR++;
    $('kb').textContent=killsB; $('kr').textContent=killsR;
    if(camFocus===victim) camFocus=null;
  },120);
}
let tracerT=0;
function ambientFire(dt,mom){
  tracerT-=dt;
  if(tracerT>0) return;
  tracerT=rand(.1,.28)/(1+Math.abs(mom));
  const side=Math.random()<.5?1:-1;
  const arr=(side>0?bulls:bears).filter(u=>u.alive);
  const foe=(side>0?bears:bulls).filter(u=>u.alive);
  if(!arr.length||!foe.length) return;
  const s=pick(arr), t=pick(foe);
  const from=s.root.position.clone(); from.y+=1.6;
  const to=t.root.position.clone(); to.y+=rand(.8,2.2);
  to.x+=rand(-3,3); to.z+=rand(-3,3);
  fireTracer(from,to,1);
  if(Math.random()<.25) impact(new THREE.Vector3(to.x,1,to.z)); // near-miss dust
}

/* ---------------- broadcast camera + manual override ----------------
   Drag anywhere to take over the camera (orbit), pinch or scroll to zoom.
   The CAM button returns to the automatic broadcast direction. */
let camFocus=null, shotT=99, shotKind=0, shotSeed=0, camAuto=true, lastFx=0;
const freeCam={theta:1.2,phi:1.1,r:110,target:new THREE.Vector3(0,4,0)};
const camBtn=$('camBtn');
function enterFree(){
  if(!camAuto) return;
  camAuto=false;
  freeCam.target.set(lastFx,3,0);
  const off=camera.position.clone().sub(freeCam.target);
  freeCam.r=clamp(off.length(),25,340);
  freeCam.phi=Math.acos(clamp(off.y/freeCam.r,-1,1));
  freeCam.theta=Math.atan2(off.z,off.x);
  camBtn.textContent='CAM · FREE'; camBtn.classList.add('free');
}
camBtn.onclick=()=>{
  if(camAuto){ enterFree(); }
  else{ camAuto=true; shotT=99;
    camBtn.textContent='CAM · AUTO'; camBtn.classList.remove('free'); }
};
const ptr={down:false,x:0,y:0,d2:0};
const cnv=renderer.domElement;
cnv.addEventListener('pointerdown',e=>{ptr.down=true;ptr.x=e.clientX;ptr.y=e.clientY;});
addEventListener('pointerup',()=>ptr.down=false);
addEventListener('pointermove',e=>{
  if(!ptr.down) return;
  const dx=e.clientX-ptr.x, dy=e.clientY-ptr.y;
  if(camAuto && Math.hypot(dx,dy)>6) enterFree();
  if(camAuto) return;
  freeCam.theta+=dx*.005;
  freeCam.phi=clamp(freeCam.phi-dy*.004,.22,1.52);
  ptr.x=e.clientX; ptr.y=e.clientY;
});
cnv.addEventListener('wheel',e=>{ enterFree();
  freeCam.r=clamp(freeCam.r*(1+e.deltaY*.001),25,340); e.preventDefault(); },{passive:false});
cnv.addEventListener('touchstart',e=>{ if(e.touches.length===2)
  ptr.d2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
cnv.addEventListener('touchmove',e=>{ if(e.touches.length===2){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  enterFree();
  freeCam.r=clamp(freeCam.r*(ptr.d2/d),25,340); ptr.d2=d; e.preventDefault(); }},{passive:false});

function newShot(fx){
  shotT=0; shotSeed=Math.random()*1000;
  const r=Math.random();
  if(r<.4){ shotKind=0; }                                     // wide orbit
  else if(r<.72){ shotKind=1;                                  // embed with a soldier
    const alive=units.filter(u=>u.alive).sort((a,b)=>a.depth-b.depth);
    camFocus=alive[(Math.random()*Math.min(10,alive.length))|0]||null;
    if(!camFocus) shotKind=0;
  }
  else if(r<.88){ shotKind=2; }                                // low tracking shot along the line
  else { shotKind=3; }                                         // objective mast reveal
}
function updateCamera(dt,fx){
  lastFx=fx;
  if(!camAuto){
    const t=freeCam.target;
    t.x += (fx - t.x)*Math.min(1,dt*.5);   // gently keep the battle in frame
    camera.position.set(
      t.x+freeCam.r*Math.sin(freeCam.phi)*Math.cos(freeCam.theta),
      t.y+freeCam.r*Math.cos(freeCam.phi),
      t.z+freeCam.r*Math.sin(freeCam.phi)*Math.sin(freeCam.theta));
    camera.lookAt(t);
    return;
  }
  shotT+=dt;
  const dur=shotKind===1?9:13;
  if(shotT>dur) newShot(fx);
  const mid=new THREE.Vector3(fx,3,0);
  const ease=1-Math.exp(-dt*(shotT<.7?4:1.1));
  /* every shot stays on the south side of the field so the screen always
     reads: marines (bulls) on the LEFT — orks (bears) on the RIGHT */
  if(shotKind===0){
    const t=clock.getElapsedTime()*.045+shotSeed;
    const a=Math.PI/2+Math.sin(t)*1.0;
    const r=80+Math.sin(shotSeed*3.7)*30, h=18+((shotSeed*7)%1)*34;
    camera.position.lerp(new THREE.Vector3(mid.x+Math.cos(a)*r,h,Math.sin(a)*r),ease);
    camera.lookAt(mid);
  } else if(shotKind===1 && camFocus && camFocus.alive){
    const p=camFocus.root.position;
    camera.position.lerp(new THREE.Vector3(p.x-camFocus.side*5,5.5,p.z+9),1-Math.exp(-dt*2.4));
    camera.lookAt(p.x+camFocus.side*12,1.8,p.z-2);
  } else if(shotKind===2){
    const t=(shotT/13);
    camera.position.lerp(new THREE.Vector3(fx-30+t*60,5,30),ease);
    camera.lookAt(fx,2,-4);
  } else {
    const t=clock.getElapsedTime()*.06+shotSeed;
    const a=Math.PI/2+Math.sin(t)*.9;
    camera.position.lerp(new THREE.Vector3(Math.cos(a)*34,10+shotT*1.6,8+Math.sin(a)*34),ease);
    camera.lookAt(0,16+shotT*.8,8);
  }
  if(shotKind===1 && (!camFocus||!camFocus.alive)) newShot(fx);
}
newShot(0);

/* ---------------- HUD ---------------- */
const fmt=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function updateHUD(fx){
  $('px').textContent='$'+fmt(price.p);
  const d=(price.p/price.anchor-1)*100;
  const dl=$('dl');
  dl.textContent=`anchor ${d>=0?'+':''}${d.toFixed(3)}%`;
  dl.className='dl '+(d>=0?'up':'down');
  const n=fx/(FIELD_X*.72);
  $('barLfill').style.width=(n>0? n*100:0)+'%';
  $('barRfill').style.width=(n<0?-n*100:0)+'%';
}

/* ---------------- main loop ---------------- */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.1), T=clock.getElapsedTime();
  priceStep(dt);
  const fx=frontline(), mom=momentum();

  killTimer-=dt;
  if(killTimer<=0){ tryKill(mom); killTimer=rand(.35,1.1)/(1+Math.abs(mom)*2.2); }
  ambientFire(dt,mom);
  updateMachines(dt,fx,mom,T);

  for(const u of units){
    const m=u.root;
    if(!u.alive){
      const since=T-u.deadAt;
      if(u.actions&&u.actions.death){
        u.mixer.update(dt);                                   // play out the death anim
        m.position.y=-Math.min(1.3,Math.max(0,since-1.9)*1.1); // then sink into the regolith
      }else{
        m.rotation.z=u.side*Math.min(1,since*3.5)*Math.PI/2*.92;
        m.position.y=-Math.min(1.2,Math.max(0,since-1.8)*1.2);
      }
      if(T>u.respawnAt){
        u.alive=true; m.rotation.z=0; m.position.y=0;
        u.depth=24+u.rank*5+rand(-2,2);
        m.position.x=u.side>0? -FIELD_X : FIELD_X;
        m.position.z=u.z;
        if(u.actions){
          if(u.actions.death) u.actions.death.stop();
          u.current=null; setAnim(u,'run');
        }
      }
      continue;
    }
    const tx=clamp(fx - u.side*u.depth, -FIELD_X, FIELD_X);
    const dx=tx-m.position.x;
    const step=clamp(dx,-u.speed*dt,u.speed*dt);
    m.position.x+=step;
    m.position.z=u.z+Math.sin(T*.35+u.seed)*1.3;
    const moving=Math.abs(dx)>.4;
    if(u.mixer){
      u.mixer.update(dt);
      setAnim(u,moving?'run':'fire');
      m.position.y=0; m.rotation.x=0;
      m.rotation.y=(u.side>0?0:Math.PI)+Math.sin(T*.6+u.seed)*.08;
    }else{
      // low bounding run in lunar gravity; kneel behind cover when static
      u.crouchT+=dt;
      const crouch = !moving && Math.sin(u.crouchT*.5+u.seed)>0.2 ? .35 : 0;
      m.position.y = moving ? Math.abs(Math.sin(T*5.5+u.seed))*.5 : -crouch;
      m.rotation.x = moving ? Math.sin(T*5.5+u.seed)*.06 : (crouch?.18:0);
      m.rotation.y = (u.side>0?0:Math.PI)+Math.sin(T*.6+u.seed)*.1;
    }
  }

  for(let i=lasers.length-1;i>=0;i--){ const L=lasers[i]; L.life-=dt;
    L.m.material.opacity=Math.max(0,L.life/.11);
    if(L.life<=0){ scene.remove(L.m); L.m.material.dispose(); lasers.splice(i,1);} }
  for(let i=bursts.length-1;i>=0;i--){ const B=bursts[i]; B.life-=dt;
    const pos=B.pts.geometry.attributes.position;
    for(let j=0;j<B.vel.length;j++){
      pos.setX(j,pos.getX(j)+B.vel[j].x*dt);
      pos.setY(j,Math.max(0,pos.getY(j)+B.vel[j].y*dt));
      pos.setZ(j,pos.getZ(j)+B.vel[j].z*dt);
      B.vel[j].y-=9*dt;   // lunar gravity: dust hangs
    }
    pos.needsUpdate=true;
    B.pts.material.opacity=(B.life/B.max)*.9;
    if(B.life<=0){ scene.remove(B.pts); B.pts.geometry.dispose(); B.pts.material.dispose(); bursts.splice(i,1);} }

  for(const s of smokes){
    s.s.position.y+=s.v*dt;
    s.s.scale.multiplyScalar(1+dt*.12);
    s.s.material.opacity-=dt*.05;
    if(s.s.position.y>22||s.s.material.opacity<=0){
      s.s.position.set(s.sx+rand(-2,2),rand(1,3),s.sz+rand(-2,2));
      s.s.scale.setScalar(rand(3,6));
      s.s.material.opacity=.35;
    }
  }

  // the planet's halo carries the market mood: green for bulls, red for bears
  const mc=new THREE.Color(0xf7b478);
  mc.lerp(new THREE.Color(mom>0?0x3ddc84:0xff5252), Math.abs(mom)*.55);
  planetGlow.material.color.copy(mc);
  const pulse=1+Math.abs(mom)*.18;
  planetGlow.scale.set(340*pulse,340*pulse,1);

  updateCamera(dt,fx);
  updateHUD(fx);
  renderer.render(scene,camera);
}
setFeedBadge();
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
